name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check version and notes
        run: node scripts/release.ts check "$GITHUB_REF_NAME"
      - name: Confirm the tagged commit is on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  assemble:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          merge-multiple: true
          path: artifacts
      - run: node scripts/release.ts assemble "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global npm@11.20.0 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - name: Publish verified npm packages and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.ts publish "$GITHUB_REF_NAME"
